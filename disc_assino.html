<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teste DISC — Assino</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Manrope:wght@400;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0A1633;--blue:#214498;--gold:#E7A317;--goldb:#F7BE32;--paper:#F5F7FB;--ink:#0B1120;--soft:#4C5573;--line:#E2E6F0}
*{box-sizing:border-box}body{margin:0;font-family:Manrope,system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.5}
h1,h2,h3{font-family:Archivo;letter-spacing:-.02em;margin:0}
.top{background:var(--navy);color:#fff;padding:16px 20px;display:flex;align-items:center;gap:12px}
.top img{height:40px;width:40px;border-radius:50%}
.top .wm{font-family:Archivo;font-weight:800;letter-spacing:.1em;font-size:14px}.top .wm small{display:block;font-weight:600;color:#9fb0d8;letter-spacing:.04em;font-size:10px}
.wrap{max-width:720px;margin:0 auto;padding:22px 16px 80px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:14px}
.q{font-size:15px;font-weight:600;margin-bottom:10px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opts button{flex:1;min-width:64px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px;font-weight:800;color:var(--soft);cursor:pointer}
.opts button.on{background:var(--goldb);border-color:var(--gold);color:var(--navy)}
.scale{font-size:11px;color:var(--soft);display:flex;justify-content:space-between;margin-top:6px}
.btn{border:0;border-radius:10px;padding:13px 18px;font-weight:800;font-size:15px;cursor:pointer}
.btn.gold{background:var(--goldb);color:var(--navy)}.btn.navy{background:var(--navy);color:#fff}
.prog{height:8px;background:#e6ebf5;border-radius:99px;overflow:hidden;margin:10px 0 18px}.prog>div{height:100%;background:var(--blue);width:0%}
.result{text-align:center}.bars{margin:16px 0}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:8px}.bar .l{width:120px;text-align:left;font-weight:700;font-size:13px}
.bar .t{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:99px;height:18px;overflow:hidden}.bar .f{height:100%;background:var(--blue)}
.code{font-family:JetBrains Mono;font-weight:700;background:var(--navy);color:var(--goldb);border-radius:10px;padding:12px;word-break:break-all;font-size:12px;margin:12px 0}
.hide{display:none}
.intro p{color:var(--soft)}
</style></head><body>

<div class="wrap">
 <div id="intro" class="card intro">
   <h2 style="color:var(--navy)">Teste de perfil comportamental (DISC)</h2>
   <p id="who"></p>
   <p>São 16 afirmações. Para cada uma, indique o quanto você concorda, de <b>1 (discordo)</b> a <b>4 (concordo)</b>. Leva ~4 minutos. Não há resposta certa — seja espontâneo.</p>
   <button class="btn gold" onclick="start()">Começar</button>
 </div>
 <div id="quiz" class="hide"></div>
 <div id="out" class="hide"></div>
</div>
<script>
const Q=[["D", "Assumo o controle quando um processo trava."], ["D", "Gosto de desafios difíceis e prazos apertados."], ["D", "Sou direto ao apontar um problema."], ["D", "Tomo decisões rápidas mesmo sob incerteza."], ["I", "Convenço as pessoas com facilidade."], ["I", "Gosto de conhecer gente nova e criar rede."], ["I", "Trago energia e otimismo ao time."], ["I", "Comunico ideias de forma envolvente."], ["S", "Prefiro rotinas estáveis e previsíveis."], ["S", "Sou paciente e bom ouvinte."], ["S", "Ajudo colegas mesmo sem ser pedido."], ["S", "Evito conflito e busco harmonia."], ["C", "Reviso tudo em detalhe antes de entregar."], ["C", "Sigo processos e regras à risca."], ["C", "Baseio decisões em dados e análise."], ["C", "Incomoda-me trabalho impreciso."]];
const params=new URLSearchParams(location.search);
const CID=params.get('cid')||'', NOME=params.get('nome')||'', VAGA=params.get('vaga')||'', BE=params.get('be')||'';
document.getElementById('who').innerHTML = (NOME?('Olá, <b>'+NOME.replace(/[<>]/g,'')+'</b>! '):'')+(VAGA?('Vaga: <b>'+VAGA.replace(/[<>]/g,'')+'</b>.'):'');
let ans=Array(Q.length).fill(0);
function start(){document.getElementById('intro').classList.add('hide');document.getElementById('quiz').classList.remove('hide');render();}
function render(){
  const done=ans.filter(x=>x>0).length;
  document.getElementById('quiz').innerHTML='<div class="prog"><div style="width:'+(done/Q.length*100)+'%"></div></div>'+
    Q.map((q,i)=>'<div class="card"><div class="q">'+(i+1)+'. '+q[1]+'</div><div class="opts">'+[1,2,3,4].map(n=>'<button class="'+(ans[i]===n?'on':'')+'" onclick="pick('+i+','+n+')">'+n+'</button>').join('')+'</div><div class="scale"><span>discordo</span><span>concordo</span></div></div>').join('')+
    '<button class="btn navy" style="width:100%" onclick="finish()">Ver meu resultado</button>';
}
function pick(i,n){ans[i]=n;render();window.scrollBy(0,90);}
function finish(){
  if(ans.some(x=>x===0)){alert('Responda todas as afirmações.');return;}
  const acc={D:0,I:0,S:0,C:0}; Q.forEach((q,i)=>acc[q[0]]+=ans[i]);
  const tot=acc.D+acc.I+acc.S+acc.C||1;
  const payload={cid:CID,nome:NOME,vaga:VAGA,D:acc.D,I:acc.I,S:acc.S,C:acc.C,at:new Date().toISOString()};
  const code='DISC-'+btoa(unescape(encodeURIComponent(JSON.stringify({D:acc.D,I:acc.I,S:acc.S,C:acc.C,cid:CID}))));
  const dom=Object.entries(acc).sort((a,b)=>b[1]-a[1]);
  const NAMES={D:'Dominância',I:'Influência',S:'Estabilidade',C:'Conformidade'};
  document.getElementById('quiz').classList.add('hide');
  const out=document.getElementById('out');out.classList.remove('hide');
  out.innerHTML='<div class="card result"><h2 style="color:var(--navy)">Perfil concluído — obrigado!</h2>'+
    '<div class="bars">'+['D','I','S','C'].map(k=>{const p=Math.round(acc[k]/tot*100);return '<div class="bar"><div class="l">'+NAMES[k]+' ('+k+')</div><div class="t"><div class="f" style="width:'+p+'%"></div></div><div style="width:38px;font-weight:800">'+p+'%</div></div>';}).join('')+'</div>'+
    '<p style="color:var(--soft)">Perfil predominante: <b>'+NAMES[dom[0][0]]+'</b>.</p>'+
    '<div id="sendmsg"></div>'+
    '<div id="codebox"><p style="color:var(--soft);margin-top:14px">Copie o código abaixo e envie para o recrutador:</p><div class="code" id="thecode">'+code+'</div><button class="btn gold" onclick="cp()">Copiar código</button></div></div>';
  if(BE){ out.querySelector('#sendmsg').innerHTML='<p style="color:var(--soft)">Enviando resultado…</p>';
    fetch(BE,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'disc',data:payload})})
      .then(()=>{out.querySelector('#sendmsg').innerHTML='<p style="color:#256129;font-weight:700">Resultado enviado com sucesso ✓ Você pode fechar esta página.</p>';out.querySelector('#codebox').style.display='none';})
      .catch(()=>{out.querySelector('#sendmsg').innerHTML='<p style="color:var(--warn,#B5761A)">Não consegui enviar automaticamente — use o código abaixo.</p>';});
  }
}

</script></body></html>
